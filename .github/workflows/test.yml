name: Test

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15-dev"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ccache (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Restore ccache (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-test-${{ runner.os }}-${{ matrix.python-version }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-test-${{ runner.os }}-${{ matrix.python-version }}-

      - name: ccache pre-build stats (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          ccache --zero-stats || true
          ccache --show-config

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CMAKE_ARGS: >-
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run tests
        run: python -m pytest

      - name: ccache post-build stats (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: ccache --show-stats

  cpp-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-cpp-tests-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-cpp-tests-${{ runner.os }}-

      - name: ccache pre-build stats
        run: |
          ccache --zero-stats || true
          ccache --show-config

      - name: Configure CMake with C++ tests enabled
        run: cmake -S . -B build-cpptest -DBITBUF_BUILD_CPP_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content

      - name: Build bitbuf_cpp_tests target
        run: cmake --build build-cpptest --target bitbuf_cpp_tests --config Release
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content

      - name: Run bitbuf_cpp_tests via CTest
        run: ctest --test-dir build-cpptest --output-on-failure -R bitbuf_cpp_tests

      - name: ccache post-build stats
        run: ccache --show-stats
